<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAS-AI-Hospital - Medical Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #01579b 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            border-top: 5px solid #1976d2;
        }
        .header h1 {
            color: #1565c0;
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .badge {
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.4);
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            border-top: 4px solid #1976d2;
            margin-bottom: 20px;
        }
        .card h2 {
            color: #1565c0;
            margin-bottom: 20px;
            border-bottom: 3px solid #1976d2;
            padding-bottom: 12px;
        }
        button {
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            margin: 5px;
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.3);
        }
        button:hover {
            background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%);
            transform: translateY(-2px);
        }
        .result {
            background: #263238;
            color: #eceff1;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            font-family: monospace;
            overflow-x: auto;
            max-height: 450px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 VAS-AI-Hospital</h1>
            <div class="badge">🚀 LIVE ON VERCEL</div>
        </div>
        <div class="card">
            <h2>🤖 AI Gateway</h2>
            <button onclick="test()">Test API</button>
            <pre class="result" id="result">Ready</pre>
        </div>
    </div>
    <script>
        async function test() {
            const res = await fetch('/api/ai-gateway/capabilities');
            const data = await res.json();
            document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
